name: Local release controls

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install delivery contract dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Run local unit and CLI tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Replay synthetic release and state transitions
        run: python -m agentops --mode simulated demo --output ci-demo --source-revision ${{ github.sha }}
      - name: Compile infrastructure templates without Azure login
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          az bicep build --file infra/budget.bicep --outfile ci-demo/budget-template.json
          az bicep build --file infra/environment.bicep --outfile ci-demo/environment-template.json
          az bicep build --file infra/registry.bicep --outfile ci-demo/registry-template.json
      - name: Build containers and check non-root imports without runtime credentials
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          docker build --tag agentops-hosted-ci --file Dockerfile.hosted .
          docker build --tag agentops-mcp-ci --file Dockerfile.mcp .
          docker run --rm --network none --entrypoint python agentops-hosted-ci -c "import os; from agentops.hosted_runtime import events; assert os.getuid() == 10001"
          docker run --rm --network none --entrypoint python agentops-mcp-ci -c "import os; from agentops.mcp_tool import dispatch; assert os.getuid() == 10001"
