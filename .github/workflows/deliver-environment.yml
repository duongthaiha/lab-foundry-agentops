name: Protected native environment operation

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      digest:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
    secrets:
      DELIVERY_BINDING:
        required: true

permissions:
  contents: read

jobs:
  deliver:
    name: ${{ inputs.action }} - ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_DELIVERY_ENABLED: ${{ vars.LIVE_DELIVERY_ENABLED }}
      DELIVERY_POLICY: ${{ vars.DELIVERY_POLICY }}
      DELIVERY_BINDING: ${{ secrets.DELIVERY_BINDING }}
      RELEASE_DIGEST: ${{ inputs.digest }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      DELIVERY_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-live.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: immutable-release
          path: .lab/release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify policy and artifact before Azure login
        shell: bash
        run: |
          set -euo pipefail
          python -m agentops.delivery_pipeline authorize --environment "$TARGET_ENVIRONMENT" \
            --action "$DELIVERY_ACTION" --bundle .lab/release/release.json --digest "$RELEASE_DIGEST"
          python -c "import json,os; b=json.loads(os.environ['DELIVERY_BINDING'])['current']; [print('::add-mask::'+b[k]) for k in ('client_id','tenant_id','subscription_id')]"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ fromJSON(secrets.DELIVERY_BINDING).current.client_id }}
          tenant-id: ${{ fromJSON(secrets.DELIVERY_BINDING).current.tenant_id }}
          subscription-id: ${{ fromJSON(secrets.DELIVERY_BINDING).current.subscription_id }}
      - name: Execute with private durable evidence and a shared lease
        shell: bash
        run: |
          set -euo pipefail
          python -m agentops.delivery_pipeline run --environment "$TARGET_ENVIRONMENT" \
            --action "$DELIVERY_ACTION" --bundle .lab/release/release.json --digest "$RELEASE_DIGEST"
