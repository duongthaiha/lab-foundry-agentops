name: Reviewed platform deployment

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Isolated lab resource group
        options: [dev, test, labprod, shared]
        required: true
      apply:
        type: boolean
        description: Apply the reviewed template after inspecting the preflight
        default: false

permissions:
  contents: read

jobs:
  platform:
    if: github.ref == 'refs/heads/main' && vars.LIVE_PLATFORM_ENABLED == 'true'
    environment: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agentops-platform-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      LAB_TARGET: ${{ inputs.target }}
      LAB_APPLY: ${{ inputs.apply }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_PLATFORM_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require scoped bootstrap configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
            echo "::add-mask::${!key}"
          done
          case "$LAB_TARGET" in
            dev|test|labprod|shared) ;;
            *) echo "::error::Invalid environment"; exit 1 ;;
          esac
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Preview or apply only the selected lab group
        shell: bash
        run: |
          set -euo pipefail
          suffix="$LAB_TARGET"
          if [ "$LAB_TARGET" = labprod ]; then suffix=prod; fi
          group="foudnry-agentops-lab-$suffix"
          args=(--subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$group"
                --name "agentops-platform-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$LAB_TARGET" = shared ]; then
            args+=(--template-file infra/registry.bicep)
          else
            args+=(--template-file infra/environment.bicep --parameters "environment=$LAB_TARGET")
          fi
          az group show --subscription "$AZURE_SUBSCRIPTION_ID" --name "$group" \
            --query id --output none
          az deployment group what-if "${args[@]}"
          if [ "$LAB_APPLY" = true ]; then
            az deployment group create "${args[@]}" --query properties.provisioningState --output tsv
          fi
