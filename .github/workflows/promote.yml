name: Native dev-test-prod promotion

on:
  workflow_dispatch:
    inputs:
      tool_image_sha256:
        description: Reviewed MCP image SHA256 (64 hex characters, same bytes in every environment)
        type: string
        required: true
      negative:
        description: Build a real no-tools negative candidate (must fail dev and never reach test)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentops-native-lifecycle
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-live.txt
      - name: Package once without Azure credentials
        id: bundle
        env:
          TOOL_IMAGE_SHA256: ${{ inputs.tool_image_sha256 }}
          NEGATIVE: ${{ inputs.negative }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$NEGATIVE" = true ]; then args+=(--negative); fi
          python -m agentops.delivery_pipeline prepare --output .lab/package \
            --source-revision "$GITHUB_SHA" --tool-image-sha256 "$TOOL_IMAGE_SHA256" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-release
          path: .lab/package/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  dev:
    needs: package
    uses: ./.github/workflows/deliver-environment.yml
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    with:
      environment: dev
      action: promote
      digest: ${{ needs.package.outputs.digest }}
      artifact_run_id: ${{ github.run_id }}

  test:
    needs: [package, dev]
    uses: ./.github/workflows/deliver-environment.yml
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    with:
      environment: test
      action: promote
      digest: ${{ needs.package.outputs.digest }}
      artifact_run_id: ${{ github.run_id }}

  prod:
    needs: [package, test]
    uses: ./.github/workflows/deliver-environment.yml
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    with:
      environment: labprod
      action: promote
      digest: ${{ needs.package.outputs.digest }}
      artifact_run_id: ${{ github.run_id }}
