name: Bounded unattended dev smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-smoke:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: agentops-dev-smoke
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_DEV_SMOKE_ENABLED: ${{ vars.LIVE_DEV_SMOKE_ENABLED }}
      DEV_SMOKE_POLICY: ${{ vars.DEV_SMOKE_POLICY }}
      DEV_SMOKE_BINDING: ${{ secrets.DEV_SMOKE_BINDING }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Verify unattended dev policy before Azure login
        run: |
          python -m agentops.delivery_dev authorize
          python -c "import json,os; b=json.loads(os.environ['DEV_SMOKE_BINDING']); [print('::add-mask::'+b[k]) for k in ('client_id','tenant_id','subscription_id')]"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ fromJSON(secrets.DEV_SMOKE_BINDING).client_id }}
          tenant-id: ${{ fromJSON(secrets.DEV_SMOKE_BINDING).tenant_id }}
          subscription-id: ${{ fromJSON(secrets.DEV_SMOKE_BINDING).subscription_id }}
      - name: Deploy and grade the bounded prompt smoke
        run: python -m agentops.delivery_dev run
